; GTAIV-FastGPS v0.8 - restart the game after editing.
; All distances are in game-world units. 1 = enabled, 0 = disabled.
[Routing]
PreferForward=1
AdaptiveDetours=1
; Initial extra route length: 50% of native route, up to 1000 units.
DetourPercent=50
MaxExtraDistance=1000
; After up to 3 consecutive detour rejections, increase to these limits.
AdaptiveMaxPercent=100
AdaptiveMaxExtraDistance=2000
; Keep a working forward route if local motion still matches it.
PreserveForwardRoute=1

[Diagnostics]
; GTAIV-FastGPS.log is recreated beside the ASI at startup.
Logging=1
